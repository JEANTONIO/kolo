<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>Changer le mot de passe — KÔLÔ</title>
  <link rel="icon" href="logo.png">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#080b10,#101823);color:#fff;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,460px);background:rgba(20,27,38,.96);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .logo{display:block;width:74px;height:74px;object-fit:contain;margin:0 auto 16px}
    h1{margin:0 0 8px;text-align:center;font-size:28px}
    .lead{margin:0 0 24px;text-align:center;color:#aeb8c6;line-height:1.55}
    label{display:block;margin:16px 0 7px;font-weight:600}
    input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #394454;background:#0d131c;color:#fff;font-size:16px;outline:none}
    input:focus{border-color:#ffd447;box-shadow:0 0 0 3px rgba(255,212,71,.12)}
    button{width:100%;margin-top:20px;padding:14px 16px;border:0;border-radius:12px;background:#ffd447;color:#111;font-weight:800;font-size:16px;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .message{display:none;margin:16px 0 0;padding:12px 14px;border-radius:12px;line-height:1.45}
    .message.error{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#ffb4b4}
    .message.success{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#a7f3bd}
    .hidden{display:none!important}
    .back{display:block;margin-top:18px;text-align:center;color:#ffd447;text-decoration:none}
    .small{font-size:13px;color:#8f9bab;text-align:center;margin-top:18px;line-height:1.5}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="KÔLÔ">
    <h1>Changer le mot de passe</h1>
    <p class="lead">Choisis un nouveau mot de passe pour sécuriser ton compte KÔLÔ.</p>

    <form id="resetForm" class="hidden">
      <label for="password">Nouveau mot de passe</label>
      <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
      <label for="confirm">Confirmer le mot de passe</label>
      <input id="confirm" name="confirm" type="password" minlength="6" autocomplete="new-password" required>
      <button id="submitBtn" type="submit">Enregistrer le nouveau mot de passe</button>
    </form>

    <div id="message" class="message" role="alert"></div>
    <a id="backLink" class="back hidden" href="index.html">Retour à KÔLÔ</a>
    <p class="small">Le lien de réinitialisation est temporaire. Si le lien a expiré, demande un nouveau lien depuis la connexion.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    const sb=window.supabase.createClient(KOLO_CONFIG.SUPABASE_URL,KOLO_CONFIG.SUPABASE_ANON_KEY);
    const form=document.getElementById('resetForm');
    const msg=document.getElementById('message');
    const btn=document.getElementById('submitBtn');
    const back=document.getElementById('backLink');

    function message(text,type){
      msg.textContent=text;
      msg.className='message '+type;
    }

    function showForm(){
      form.classList.remove('hidden');
      back.classList.remove('hidden');
    }

    function showError(text){
      form.classList.add('hidden');
      back.classList.remove('hidden');
      message(text,'error');
    }

    form.addEventListener('submit',async(e)=>{
      e.preventDefault();
      const password=document.getElementById('password').value;
      const confirm=document.getElementById('confirm').value;
      if(password.length<6)return message('Le mot de passe doit contenir au moins 6 caractères.','error');
      if(password!==confirm)return message('Les deux mots de passe ne correspondent pas.','error');

      btn.disabled=true;
      btn.textContent='Enregistrement…';
      const {error}=await sb.auth.updateUser({password});
      btn.disabled=false;
      btn.textContent='Enregistrer le nouveau mot de passe';

      if(error)return message('Impossible de modifier le mot de passe : '+error.message,'error');

      message('Mot de passe modifié avec succès. Tu peux maintenant te connecter.','success');
      form.classList.add('hidden');
      back.classList.remove('hidden');
      await sb.auth.signOut();
      history.replaceState({},document.title,location.pathname);
    });

    (async()=>{
      const hash=new URLSearchParams(location.hash.replace(/^#/,''));
      const params=new URLSearchParams(location.search);
      const errorDescription=hash.get('error_description')||params.get('error_description');
      const errorCode=hash.get('error_code')||params.get('error_code');

      if(errorDescription){
        return showError(errorDescription.replace(/\+/g,' '));
      }

      const {data,error}=await sb.auth.getSession();
      if(error)return showError('Impossible de vérifier le lien de réinitialisation.');
      if(data.session){
        showForm();
        return;
      }

      // Supabase peut établir la session juste après l'arrivée du lien.
      const {data:listener}=sb.auth.onAuthStateChange((event,session)=>{
        if(event==='PASSWORD_RECOVERY' && session){
          showForm();
        }
      });

      setTimeout(async()=>{
        const {data:current}=await sb.auth.getSession();
        if(!current.session){
          showError(errorCode==='otp_expired'
            ? 'Ce lien de réinitialisation a expiré. Demande un nouveau lien depuis la page de connexion.'
            : 'Lien de réinitialisation invalide ou expiré. Demande un nouveau lien depuis la page de connexion.');
        }
      },1500);
    })();
  </script>
</body>
</html>
